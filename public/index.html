<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro de usuários</title>

</head>

<body>

    <h1>Cadastro de usuários</h1>


    <form id="formulario">

        <label for="nome">
            Nome:
        </label>

        <input
            id="nome"
            type="text"
            required
        >


        <br><br>


        <label for="email">
            E-mail:
        </label>

        <input
            id="email"
            type="email"
            required
        >


        <br><br>


        <button type="submit">
            Cadastrar
        </button>

    </form>


    <p id="mensagem"></p>


    <hr>


    <h2>Usuários cadastrados</h2>


    <ul id="listaUsuarios"></ul>



    <script>

        const formulario =
            document.querySelector("#formulario");

        const campoNome =
            document.querySelector("#nome");

        const campoEmail =
            document.querySelector("#email");

        const mensagem =
            document.querySelector("#mensagem");

        const listaUsuarios =
            document.querySelector("#listaUsuarios");



        async function carregarUsuarios() {

            const resposta =
                await fetch("/api/usuarios");

            const usuarios =
                await resposta.json();


            listaUsuarios.innerHTML = "";


            usuarios.forEach(usuario => {

                const item =
                    document.createElement("li");

                item.textContent =
                    `${usuario.id} - ${usuario.nome} - ${usuario.email}`;

                listaUsuarios.appendChild(item);

            });
        }



        formulario.addEventListener(
            "submit",
            async function(evento) {

                evento.preventDefault();


                const nome =
                    campoNome.value;

                const email =
                    campoEmail.value;


                const resposta =
                    await fetch(
                        "/api/usuarios",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                nome,
                                email
                            })
                        }
                    );


                const dados =
                    await resposta.json();


                if (!resposta.ok) {

                    mensagem.textContent =
                        dados.erro;

                    return;
                }


                mensagem.textContent =
                    "Usuário cadastrado!";


                formulario.reset();


                await carregarUsuarios();
            }
        );



        carregarUsuarios();

    </script>

</body>

</html>
